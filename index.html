<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Sky</title>
    <meta
      name="description"
      content="Pagina inicial do Site Sky publicada com GitHub Pages."
    />
    <style>
      :root {
        color-scheme: light;
        --sky: #8ed8ff;
        --sky-deep: #2d8fe3;
        --ink: #14324a;
        --paper: #ffffff;
        --sun: #ffd166;
        --coral: #ff7a59;
        --leaf: #2f9e75;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: #f7fbff;
      }

      .page {
        min-height: 100vh;
        overflow: hidden;
      }

      .hero {
        position: relative;
        min-height: 88vh;
        display: grid;
        align-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 78% 18%, rgba(255, 209, 102, 0.95) 0 56px, transparent 58px),
          linear-gradient(180deg, #aee5ff 0%, var(--sky) 45%, #d8f4ff 100%);
      }

      .nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px clamp(20px, 5vw, 72px);
      }

      .brand {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .pill {
        border: 1px solid rgba(20, 50, 74, 0.16);
        border-radius: 999px;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .hero-content {
        position: relative;
        z-index: 2;
        width: min(860px, 100%);
        margin: 0 auto;
        text-align: center;
        padding-top: 32px;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 8rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .lead {
        width: min(620px, 100%);
        margin: 24px auto 0;
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        line-height: 1.5;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 8px;
        border: 0;
        background: var(--ink);
        color: var(--paper);
        font-weight: 800;
        text-decoration: none;
      }

      .button.secondary {
        background: var(--paper);
        color: var(--ink);
      }

      .cloud {
        position: absolute;
        width: 180px;
        height: 60px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow:
          48px -18px 0 12px rgba(255, 255, 255, 0.88),
          94px 2px 0 8px rgba(255, 255, 255, 0.88);
        opacity: 0.9;
      }

      .cloud.one {
        left: 7%;
        top: 26%;
      }

      .cloud.two {
        right: 12%;
        bottom: 26%;
        transform: scale(1.25);
      }

      .cloud.three {
        left: 50%;
        bottom: 13%;
        transform: scale(0.78);
      }

      .ground {
        position: absolute;
        left: -5vw;
        right: -5vw;
        bottom: -68px;
        height: 190px;
        border-radius: 50% 50% 0 0;
        background: linear-gradient(90deg, var(--leaf), #71c98d 48%, var(--coral));
      }

      .status {
        padding: 36px 24px 48px;
        background: var(--paper);
      }

      .status-inner {
        width: min(940px, 100%);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .status-item {
        min-height: 112px;
        border: 1px solid #d8e8f4;
        border-radius: 8px;
        padding: 18px;
        background: #fbfdff;
      }

      .status-item strong {
        display: block;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }

      .status-item span {
        color: #4e6a7e;
        line-height: 1.45;
      }

      @media (max-width: 720px) {
        .hero {
          min-height: 86vh;
          padding: 20px;
        }

        .nav {
          padding: 16px 20px;
        }

        .pill {
          max-width: 52vw;
          text-align: center;
        }

        .cloud {
          transform: scale(0.72);
        }

        .cloud.two {
          right: -8%;
          bottom: 20%;
          transform: scale(0.85);
        }

        .status-inner {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-label="Inicio">
        <header class="nav">
          <div class="brand">SKY</div>
          <div class="pill">GitHub Pages</div>
        </header>

        <div class="cloud one"></div>
        <div class="cloud two"></div>
        <div class="cloud three"></div>
        <div class="ground"></div>

        <div class="hero-content">
          <h1>Site Sky</h1>
          <p class="lead">
            Seu site esta pronto para ser publicado. Esta pagina inicial confirma
            que o projeto ja esta conectado ao GitHub.
          </p>
          <div class="actions">
            <a class="button" href="https://github.com/Leo160708/Site-Sky-">Ver repositorio</a>
            <a class="button secondary" href="#status">Status</a>
          </div>
        </div>
      </section>

      <section class="status" id="status" aria-label="Status do projeto">
        <div class="status-inner">
          <div class="status-item">
            <strong>Repositorio</strong>
            <span>Leo160708/Site-Sky-</span>
          </div>
          <div class="status-item">
            <strong>Branch</strong>
            <span>main</span>
          </div>
          <div class="status-item">
            <strong>Publicacao</strong>
            <span>GitHub Pages pela pasta raiz</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
